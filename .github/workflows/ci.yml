name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: 检查（fmt / clippy / test）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test --all-targets

  build:
    name: 构建 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
          - label: macOS x86_64
            os: macos-14
            target: x86_64-apple-darwin
          - label: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 编译
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 冒烟测试
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/mssql-transfer"
          if [ -f "${BIN}.exe" ]; then BIN="${BIN}.exe"; fi
          "$BIN" --version

      # 用软件渲染器离屏画一遍 7 个页面，验证 UI 构造与渲染链路不炸
      - name: UI 渲染冒烟
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "target/${{ matrix.target }}/release/mssql-transfer" --screenshot /tmp/ui.png
          ls -lh /tmp/ui.png
